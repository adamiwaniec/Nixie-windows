[workspace]
resolver = "2"
members = ["src/daemon", "src/common", "src/sidecar"]

[workspace.dependencies]
bincode = "1.3.3"
colored = "2.1.0"
cudarc = { version = "0.19.8", default-features = false, features = [
    "std",
    "driver",
] }
futures = "0.3.31"
nix = { version = "0.29.0", features = ["fs", "user", "ioctl"] }
serde = { version = "1", features = ["derive"] }
tarpc = { version = "0.35.0", features = ["serde-transport"] }
thiserror = "2"
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_Security",
] }

[profile.release]
debug = true
